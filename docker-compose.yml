version: "3.9"

services:

  backend:
    container_name: erp-workflow-backend
    build:
      context: ./ErpWorkFlow_backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - erp-network


  frontend:
    container_name: erp-workflow-frontend
    build:
      context: ./ErpWorkFlowFrontEnd
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080/api
    networks:
      - erp-network


networks:
  erp-network:
    driver: bridge
